# Example v1 PyTorchJob CRD structure
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: distributed-training
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        spec:
          containers:
          - name: pytorch
            image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
            command: ["python", "/workspace/train.py"]
            resources:
              limits:
                nvidia.com/gpu: 1
                memory: 8Gi
              requests:
                cpu: 4
                memory: 4Gi
    Worker:
      replicas: 2
      template:
        spec:
          containers:
          - name: pytorch
            image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
            command: ["python", "/workspace/train.py"]
            resources:
              limits:
                nvidia.com/gpu: 1
                memory: 8Gi
