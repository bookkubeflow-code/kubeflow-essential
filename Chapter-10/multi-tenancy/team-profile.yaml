apiVersion: kubeflow.org/v1
kind: Profile
metadata:
  name: team-ml-fraud
spec:
  owner:
    kind: User
    name: jane@example.com

  resourceQuotaSpec:
    hard:
      # Compute resources
      requests.cpu: "64"
      requests.memory: "256Gi"
      requests.nvidia.com/gpu: "8"

      # Storage resources
      persistentvolumeclaims: "20"
      requests.storage: "500Gi"

      # Object counts
      pods: "100"
      services: "20"

  plugins:
    - kind: WorkspacePlugin
      spec:
        workspace:
          persistentStorage:
            enabled: true
            storageClassName: fast-ssd
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
